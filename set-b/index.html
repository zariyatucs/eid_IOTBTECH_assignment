<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>motivation Board</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: "Segoe UI", sans-serif;
        background: #0f172a;
        color: #e2e8f0;
        min-height: 100vh;
        padding: 1.5rem;
      }
      h1 {
        text-align: center;
        color: #38bdf8;
        margin-bottom: 1.5rem;
        font-size: 1.8rem;
      }
      .board {
        display: flex;
        gap: 1rem;
        overflow-x: auto;
        padding-bottom: 1rem;
      }
      .column {
        flex: 1;
        min-width: 260px;
        background: #1e293b;
        border-radius: 12px;
        padding: 1rem;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        min-height: 200px;
      }
      .col-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 0.5rem;
      }
      .col-header h2 {
        font-size: 1rem;
        font-weight: 700;
      }
      .count {
        background: #334155;
        border-radius: 999px;
        padding: 2px 8px;
        font-size: 0.75rem;
      }
      .add-btn {
        background: #334155;
        border: none;
        color: #94a3b8;
        padding: 0.5rem;
        border-radius: 8px;
        cursor: pointer;
        font-size: 0.85rem;
        width: 100%;
        text-align: center;
        transition: background 0.2s;
      }
      .add-btn:hover {
        background: #475569;
        color: #e2e8f0;
      }

      /* Cards */
      .card {
        background: #0f172a;
        border: 1px solid #334155;
        border-radius: 10px;
        padding: 0.85rem;
        cursor: grab;
        transition:
          box-shadow 0.2s,
          transform 0.15s;
        position: relative;
      }
      .card:hover {
        box-shadow: 0 4px 20px rgba(56, 189, 248, 0.15);
        border-color: #38bdf8;
      }
      .card.dragging {
        opacity: 0.4;
        transform: scale(0.97);
        cursor: grabbing;
      }
      .card-title {
        font-weight: 600;
        margin-bottom: 0.4rem;
        font-size: 0.95rem;
        word-break: break-word;
      }
      .card-desc {
        color: #94a3b8;
        font-size: 0.82rem;
        margin-bottom: 0.6rem;
        word-break: break-word;
      }
      .card-meta {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 0.75rem;
      }
      .priority {
        padding: 2px 8px;
        border-radius: 999px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      .priority.low {
        background: #052e16;
        color: #86efac;
      }
      .priority.medium {
        background: #422006;
        color: #fcd34d;
      }
      .priority.high {
        background: #2a0a0a;
        color: #fca5a5;
      }
      .due {
        color: #94a3b8;
      }
      .card-actions {
        display: none;
        position: absolute;
        top: 0.5rem;
        right: 0.5rem;
        gap: 0.25rem;
      }
      .card:hover .card-actions {
        display: flex;
      }
      .card-actions button {
        background: #1e293b;
        border: none;
        color: #94a3b8;
        width: 24px;
        height: 24px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 0.75rem;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .card-actions button:hover {
        color: #e2e8f0;
      }
      .column.drag-over {
        border: 2px dashed #38bdf8;
        background: #0c1f35;
      }

      /* Modal */
      .modal-backdrop {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.7);
        align-items: center;
        justify-content: center;
        z-index: 100;
      }
      .modal-backdrop.open {
        display: flex;
      }
      .modal {
        background: #1e293b;
        border-radius: 16px;
        padding: 2rem;
        width: min(440px, 90%);
      }
      .modal h3 {
        margin-bottom: 1.25rem;
        color: #38bdf8;
      }
      .field {
        margin-bottom: 1rem;
      }
      .field label {
        display: block;
        font-size: 0.85rem;
        color: #94a3b8;
        margin-bottom: 0.35rem;
      }
      .field input,
      .field textarea,
      .field select {
        width: 100%;
        background: #0f172a;
        border: 1.5px solid #334155;
        color: #e2e8f0;
        border-radius: 8px;
        padding: 0.6rem 0.8rem;
        font-size: 0.95rem;
      }
      .field textarea {
        min-height: 80px;
        resize: vertical;
      }
      .field input:focus,
      .field textarea:focus,
      .field select:focus {
        outline: none;
        border-color: #38bdf8;
      }
      .modal-actions {
        display: flex;
        gap: 0.75rem;
        justify-content: flex-end;
        margin-top: 1.25rem;
      }
      .modal-actions button {
        padding: 0.6rem 1.2rem;
        border-radius: 8px;
        border: none;
        cursor: pointer;
        font-size: 0.9rem;
        font-weight: 600;
      }
      .btn-save {
        background: #38bdf8;
        color: #0f172a;
      }
      .btn-cancel {
        background: #334155;
        color: #e2e8f0;
      }
    </style>
  </head>
  <body>
    <h1>📋 Motivation Board</h1>
    <div class="board" id="board">
      <div
        class="column"
        id="col-todo"
        data-col="todo"
        ondragover="onDragOver(event)"
        ondragleave="onDragLeave(event)"
        ondrop="onDrop(event, 'todo')"
      >
        <div class="col-header">
          <h2>📝 To Do</h2>
          <span class="count" id="cnt-todo">0</span>
        </div>
        <button class="add-btn" onclick="openModal('todo')">+ Add Card</button>
      </div>
      <div
        class="column"
        id="col-inprogress"
        data-col="inprogress"
        ondragover="onDragOver(event)"
        ondragleave="onDragLeave(event)"
        ondrop="onDrop(event, 'inprogress')"
      >
        <div class="col-header">
          <h2>🔄 In Progress</h2>
          <span class="count" id="cnt-inprogress">0</span>
        </div>
        <button class="add-btn" onclick="openModal('inprogress')">
          + Add Card
        </button>
      </div>
      <div
        class="column"
        id="col-done"
        data-col="done"
        ondragover="onDragOver(event)"
        ondragleave="onDragLeave(event)"
        ondrop="onDrop(event, 'done')"
      >
        <div class="col-header">
          <h2>✅ Done</h2>
          <span class="count" id="cnt-done">0</span>
        </div>
        <button class="add-btn" onclick="openModal('done')">+ Add Card</button>
      </div>
    </div>

    <!-- Modal -->
    <div class="modal-backdrop" id="modal">
      <div class="modal">
        <h3 id="modal-title">Add Card</h3>
        <div class="field">
          <label>Title *</label
          ><input type="text" id="f-title" placeholder="Card title" />
        </div>
        <div class="field">
          <label>Description</label
          ><textarea id="f-desc" placeholder="Details..."></textarea>
        </div>
        <div class="field">
          <label>Priority</label>
          <select id="f-priority">
            <option value="low">Low</option>
            <option value="medium" selected>Medium</option>
            <option value="high">High</option>
          </select>
        </div>
        <div class="field">
          <label>Due Date</label><input type="date" id="f-due" />
        </div>
        <div class="modal-actions">
          <button class="btn-cancel" onclick="closeModal()">Cancel</button>
          <button class="btn-save" onclick="saveCard()">Save</button>
        </div>
      </div>
    </div>

    <script>
      let cards = JSON.parse(localStorage.getItem("kanban_cards") || "[]");
      let dragId = null;
      let editId = null;
      let modalCol = null;

      function uid() {
        return Date.now().toString(36) + Math.random().toString(36).slice(2);
      }

      function save() {
        localStorage.setItem("kanban_cards", JSON.stringify(cards));
      }

      function render() {
        ["todo", "inprogress", "done"].forEach((col) => {
          const column = document.getElementById("col-" + col);
          column.querySelectorAll(".card").forEach((c) => c.remove());
          const colCards = cards.filter((c) => c.col === col);
          document.getElementById("cnt-" + col).textContent = colCards.length;
          colCards.forEach((card) => {
            const el = createCardEl(card);
            column.appendChild(el);
          });
        });
      }

      function createCardEl(card) {
        const el = document.createElement("div");
        el.className = "card";
        el.setAttribute("draggable", true);
        el.dataset.id = card.id;
        el.innerHTML = `
    <div class="card-actions">
      <button onclick="editCard('${card.id}')" title="Edit">✏️</button>
      <button onclick="deleteCard('${card.id}')" title="Delete">🗑️</button>
    </div>
    <div class="card-title">${escHtml(card.title)}</div>
    ${card.desc ? `<div class="card-desc">${escHtml(card.desc)}</div>` : ""}
    <div class="card-meta">
      <span class="priority ${card.priority}">${card.priority}</span>
      ${card.due ? `<span class="due">📅 ${card.due}</span>` : ""}
    </div>
  `;
        el.addEventListener("dragstart", () => {
          dragId = card.id;
          el.classList.add("dragging");
        });
        el.addEventListener("dragend", () => el.classList.remove("dragging"));
        return el;
      }

      function escHtml(str) {
        return String(str)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function onDragOver(e) {
        e.preventDefault();
        e.currentTarget.classList.add("drag-over");
      }
      function onDragLeave(e) {
        e.currentTarget.classList.remove("drag-over");
      }
      function onDrop(e, col) {
        e.preventDefault();
        e.currentTarget.classList.remove("drag-over");
        const card = cards.find((c) => c.id === dragId);
        if (card) {
          card.col = col;
          save();
          render();
        }
        dragId = null;
      }

      function openModal(col) {
        modalCol = col;
        editId = null;
        document.getElementById("modal-title").textContent = "Add Card";
        document.getElementById("f-title").value = "";
        document.getElementById("f-desc").value = "";
        document.getElementById("f-priority").value = "medium";
        document.getElementById("f-due").value = "";
        document.getElementById("modal").classList.add("open");
        document.getElementById("f-title").focus();
      }

      function editCard(id) {
        const card = cards.find((c) => c.id === id);
        if (!card) return;
        editId = id;
        modalCol = card.col;
        document.getElementById("modal-title").textContent = "Edit Card";
        document.getElementById("f-title").value = card.title;
        document.getElementById("f-desc").value = card.desc || "";
        document.getElementById("f-priority").value = card.priority;
        document.getElementById("f-due").value = card.due || "";
        document.getElementById("modal").classList.add("open");
      }

      function closeModal() {
        document.getElementById("modal").classList.remove("open");
      }

      function saveCard() {
        const title = document.getElementById("f-title").value.trim();
        if (!title) {
          document.getElementById("f-title").focus();
          return;
        }
        const data = {
          title,
          desc: document.getElementById("f-desc").value.trim(),
          priority: document.getElementById("f-priority").value,
          due: document.getElementById("f-due").value,
          col: modalCol,
        };
        if (editId) {
          const i = cards.findIndex((c) => c.id === editId);
          cards[i] = { ...cards[i], ...data };
        } else {
          cards.push({ id: uid(), ...data });
        }
        save();
        render();
        closeModal();
      }

      function deleteCard(id) {
        if (!confirm("Delete this card?")) return;
        cards = cards.filter((c) => c.id !== id);
        save();
        render();
      }

      document.getElementById("modal").addEventListener("click", (e) => {
        if (e.target === e.currentTarget) closeModal();
      });

      render();
    </script>
  </body>
</html>
